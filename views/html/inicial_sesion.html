
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Playa Blanca | Login</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <link rel="stylesheet" href="../css/inicial_sesion.css">
</head>

<body>

<!-- BARRA DE NAVEGACION -->
<nav class="navbar">
                <img src="../img/Logo_Hotel.png" alt="Logo Hotel Playa Blanca" width="300">

                <div class="links">
                    <a href="/index.html">Inicio</a>
                    <a href="../html/habitaciones.html">Habitaciones</a>
                    <a href="./form.html">Reservación</a>
                    <a href="#lugares_hotel">Servicios</a>
                    <a href="#contactanos">Contacto</a>
                </div>
            </nav>

<!-- CONTENIDO PRINCIPAL -->
<main class="contenido-login">

    <div class="login-card">

        <h2 class="hotel-title">
            Hotel <span>Paraíso</span>
        </h2>

        <p class="text-center text-muted">
            Acceso administrativo
        </p>

        <form id="formLogin">

            <label class="fw-semibold mt-3">Usuario</label>

            <div class="input-group mb-3">
                <span class="input-group-text">
                    <i class="bi bi-person-fill"></i>
                </span>

                <input type="text" id="usuario"
                    class="form-control"
                    placeholder="Ingrese su usuario" required>
            </div>

            <label class="fw-semibold">Contraseña</label>

            <div class="input-group mb-3">
                <span class="input-group-text">
                    <i class="bi bi-lock-fill"></i>
                </span>

                <input type="password" id="clave"
                    class="form-control"
                    placeholder="Ingrese su contraseña" required>
            </div>

            <div id="error" class="d-none text-center mb-2">
                Credenciales incorrectas
            </div>

            <button type="submit" class="btn btn-login w-100 mt-2">
                <i class="bi bi-door-open-fill"></i>
                Ingresar
            </button>

        </form>

    </div>

</main>

<!-- FOOTER -->
<footer class="footer-hotel">

    <div class="container">

        <div class="row text-center">

            <div class="col-md-4 mb-3">
                <h5>Hotel Paraíso</h5>
                <p>Tu lugar ideal para descansar y disfrutar.</p>
            </div>

            <div class="col-md-4 mb-3">
                <h5>Contáctanos</h5>
                <p><i class="bi bi-telephone-fill"></i> +506 8888-8888</p>
                <p><i class="bi bi-envelope-fill"></i> contacto@hotelparaiso.com</p>
            </div>

            <div class="col-md-4 mb-3">
                <h5>Síguenos</h5>

                <div class="redes">
                    <a href="https://www.facebook.com/" target="_blank">
                        <i class="bi bi-facebook"></i>
                    </a>

                    <a href="https://www.instagram.com/" target="_blank">
                        <i class="bi bi-instagram"></i>
                    </a>

                    <a href="https://www.whatsapp.com/" target="_blank">
                        <i class="bi bi-whatsapp"></i>
                    </a>
                </div>
            </div>

        </div>

        <hr>

        <p class="text-center mb-0">
            © 2026 Hotel Paraíso | Todos los derechos reservados.
        </p>

    </div>

</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
document.getElementById("formLogin").addEventListener("submit", function(e) {
    e.preventDefault();

    const user = document.getElementById("usuario").value.trim();
    const pass = document.getElementById("clave").value.trim();
    const error = document.getElementById("error");

    if (user === "admin" && pass === "1234") {
        localStorage.setItem("logueado", "si");
        window.location.href = "dashboard.php";
    } else {
        error.innerText = "Usuario o contraseña incorrectos";
        error.classList.remove("d-none");
    }
});
</script>

</body>
</html>
