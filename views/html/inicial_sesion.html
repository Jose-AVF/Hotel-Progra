<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Playa Blanca | Login</title>

      <!-- Fuente Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <link rel="stylesheet" href="../css/inicial_sesion.css">
</head>

<body>

    <!-- encabezado de la pagina -->
    <header class="encabezado">
        <nav class="navbar">
            <img src="../img/Logo_Hotel.png" alt="Logo Hotel Playa Blanca" width="300">

            <div class="links">
                <a href="../../index.html">Inicio</a>
                <a href="./habitaciones.html">Habitaciones</a>
                <a href="#lugares_hotel">Servicios</a>
                <a href="./dashboard.html">Información</a>
                <a href="#Contacto">Contacto</a>
                <a href="./inicial_sesion.html">Iniciar Sesión</a>
            </div>
        </nav>
    </header>

    <!-- contenido de principal de la pagina -->
    <main class="contenido-login">

        <div class="login-card">

            <h2 class="hotel-title">
                Hotel <span>Playa Blanca</span>
            </h2>

            <p class="text-center text-muted">
                Acceso administrativo
            </p>

            <form id="formLogin" novalidate>

                <!--ingreso de usuario-->
                <label for="usuario" class="semibold mt-3">Usuario</label>
                <div class="input-group mb-3">
                    <span class="input-group-text">
                        <i class="bi bi-person-fill"></i>
                    </span>
                    <input type="text" id="usuario" class="form-control" placeholder="Ingrese el usuario" required>
                </div>

                <!--contraseña-->
               <label for="clave" class="fw semibold">Contraseña</label>
                <div class="input-group mb-3">
                    <span class="input-group-text">
                        <i class="bi bi-lock-fill"></i>
                    </span>

                    <input type="password" id="clave" class="form-control" placeholder="Ingrese la contraseña" autocomplete="current-password" required>
                </div>
                <!--notificacion de error-->
                <div id="error" class="d-none text-center mb-2" role="alert" aria-live="polite">
                </div>
                <!--Boton de inicio-->
                <button type="submit" class="btn btn-login w-100 mt-2">
                    <i class="bi bi-door-open-fill"></i>
                    Ingresar
                </button>

            </form>

        </div>
    </main>

    <!-- FOOTER o pie de pagina-->
    <footer id="Contacto" class="footer-hotel">

        <div class="container">

            <div class="row text-center">

                <div class="col-md-4 mb-3">
                    <h5>Hotel Playa Blanca</h5>
                    <p>Tu lugar ideal para descansar y disfrutar.</p>
                </div>

                <div class="col-md-4 mb-3">
                    <h5>Contáctanos</h5>
                    <p><i class="bi bi-telephone-fill"></i> +506 8888-8888</p>
                    <p><i class="bi bi-envelope-fill"></i> contacto@hotelparaiso.com</p>
                </div>

                <div class="col-md-4 mb-3">
                    <h5>Síguenos</h5>

                    <div class="redes">
                        <a href="https://www.facebook.com/" target="_blank">
                            <i class="bi bi-facebook"></i>
                        </a>

                        <a href="https://www.instagram.com/" target="_blank">
                            <i class="bi bi-instagram"></i>
                        </a>

                        <a href="https://www.whatsapp.com/" target="_blank">
                            <i class="bi bi-whatsapp"></i>
                        </a>
                    </div>
                </div>

            </div>

            <hr>

            <p class="text-center mb-0">
                © 2026 Hotel Paraíso | Todos los derechos reservados.
            </p>

        </div>

    </footer>
    <!--javascrispt-->
    <script src="../js/inicio.js"></script>
</body>

</html>
